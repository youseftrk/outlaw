<div id="d2-record" class="clip" data-start="0" data-duration="14" data-track-index="1">
  <div style="position:absolute; left:150px; top:26px; right:150px">
    <p id="d2-k" class="kicker">the record</p>
    <h1 id="d2-h" class="mid" style="margin-top:18px">everything is written down.</h1>

    <div
      id="d2-panel"
      style="
        margin-top:22px;
        background:#141414;
        border:1px solid #2e2e2a;
        border-radius:20px;
        padding:12px 48px;
      "
    >
      <div class="row" data-rec>
        <span class="mono dim" style="font-size:24px; letter-spacing:0.08em">00:00</span>
        <span class="mono" style="font-size:28px; color:#ececea">asked contain · srv-api-01</span>
      </div>
      <div class="row" data-rec>
        <span class="mono dim" style="font-size:24px; letter-spacing:0.08em">00:04</span>
        <span class="mono" style="font-size:28px; color:#ececea">owner said yes</span>
      </div>
      <div class="row" data-rec>
        <span class="mono dim" style="font-size:24px; letter-spacing:0.08em">00:07</span>
        <span class="mono" style="font-size:28px; color:#ececea">code entered</span>
      </div>
      <div class="row" data-rec>
        <span class="mono dim" style="font-size:24px; letter-spacing:0.08em">00:11</span>
        <span class="mono lime" style="font-size:28px">allowed</span>
      </div>
      <div class="row" data-rec>
        <span class="mono dim" style="font-size:24px; letter-spacing:0.08em">00:38</span>
        <span class="mono" style="font-size:28px; color:#ececea">taken back</span>
      </div>
      <div class="row" data-rec style="border-bottom:none">
        <span class="mono dim" style="font-size:24px; letter-spacing:0.08em">00:41</span>
        <span class="mono red" style="font-size:28px">refused</span>
      </div>
    </div>

    <p id="d2-f" class="dim" style="margin-top:18px; font-size:30px; letter-spacing:-0.01em">
      the data never leaves the organisation that owns it.
    </p>
  </div>

  <script>
    var d2RecordTl;
    (function () {
      var build = function () {
        var tl = gsap.timeline({ paused: false });
        var in_ = function (sel, at) {
          tl.fromTo(
            sel,
            { y: 26, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
            at
          );
        };
        in_("#d2-k", 0.4);
        in_("#d2-h", 1.0);
        tl.fromTo(
          "#d2-panel",
          { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
          2.2
        );
        tl.fromTo(
          "[data-rec]",
          { y: 22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 1.1 },
          3.0
        );
        in_("#d2-f", 12.2);
        return tl;
      };
      if (window.gsap) {
        d2RecordTl = build();
      } else {
        document.addEventListener("DOMContentLoaded", function () {
          d2RecordTl = build();
        });
      }
    })();
  </script>
</div>
