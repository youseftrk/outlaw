<div id="d2-steps" class="clip" data-start="54" data-duration="26" data-track-index="1">
  <style>
    #d2-steps .d2-wrap { position: absolute; left: 150px; top: 130px; right: 150px; bottom: 0; }
    #d2-steps .d2-stage { position: absolute; left: 0; right: 0; top: 150px; height: 280px; }
    #d2-steps .d2-actor {
      position: absolute; left: 0; right: 0; top: 116px;
      display: flex; justify-content: center;
    }
    #d2-steps .d2-actor .chip { margin-right: 0; }
    /* vector-editor selection chrome — hairline + 4 corner handles */
    #d2-steps #d2-frame { position: absolute; left: 380px; top: 20px; width: 860px; height: 260px; }
    #d2-steps .d2-e { position: absolute; background: #97ff52; opacity: 0.9; }
    #d2-steps .d2-et { top: 0; left: 0; right: 0; height: 1px; transform-origin: left center; }
    #d2-steps .d2-er { top: 0; right: 0; bottom: 0; width: 1px; transform-origin: center top; }
    #d2-steps .d2-eb { bottom: 0; left: 0; right: 0; height: 1px; transform-origin: right center; }
    #d2-steps .d2-el { top: 0; left: 0; bottom: 0; width: 1px; transform-origin: center bottom; }
    #d2-steps .d2-h {
      position: absolute; width: 11px; height: 11px;
      background: #0a0a0a; border: 1.5px solid #97ff52;
    }
    #d2-steps .d2-h1 { top: -6px; left: -6px; }
    #d2-steps .d2-h2 { top: -6px; right: -6px; }
    #d2-steps .d2-h3 { bottom: -6px; right: -6px; }
    #d2-steps .d2-h4 { bottom: -6px; left: -6px; }
    #d2-steps #d2-stray { position: absolute; left: 1090px; top: 116px; margin-right: 0; }
    #d2-steps #d2-ref {
      position: absolute; left: 1090px; top: 204px;
      font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase;
      color: #ff6b5c; opacity: 0;
    }
    #d2-steps .d2-bounds { position: absolute; left: 0; right: 0; top: 470px; }
    #d2-steps .d2-bounds .d { letter-spacing: 0.04em; }
  </style>

  <div class="d2-wrap">
    <p id="d2-k" class="kicker">how it works</p>

    <div class="d2-stage">
      <div id="d2-frame">
        <i class="d2-e d2-et"></i><i class="d2-e d2-er"></i><i class="d2-e d2-eb"></i><i class="d2-e d2-el"></i>
        <i class="d2-h d2-h1"></i><i class="d2-h d2-h2"></i><i class="d2-h d2-h3"></i><i class="d2-h d2-h4"></i>
      </div>
      <div class="d2-actor"><div id="d2-chip" class="chip">contain · srv-api-01</div></div>
      <div id="d2-stray" class="chip">read users-01</div>
      <div id="d2-ref" class="mono">refused</div>
    </div>

    <div class="d2-bounds">
      <div class="row" id="d2-r1"><span class="t">only that.</span><span class="d mono">action: <span class="lime">contain</span></span></div>
      <div class="row" id="d2-r2"><span class="t">only there.</span><span class="d mono">system: <span class="lime">api-01</span></span></div>
      <div class="row" id="d2-r3"><span class="t">only as long as agreed.</span><span class="d mono">until: <span class="lime">59:59</span></span></div>
    </div>
  </div>

  <script>
    // scene timeline — authored from t=0; unpaused so the master's paused root
    // drives it once merged (paused children never advance on seek).
    var d2StepsTl;
    function d2StepsBuild() {
      d2StepsTl = gsap.timeline({ paused: false });
      var d2in = function (sel, at) {
        d2StepsTl.fromTo(sel, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, at);
      };

      d2in("#d2-k", 0.5);       // kicker
      d2in("#d2-chip", 1.4);    // the granted request

      // selection chrome draws a loose rect clockwise, then tightens onto the chip
      d2StepsTl.fromTo("#d2-frame .d2-et", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 3.0);
      d2StepsTl.fromTo("#d2-frame .d2-er", { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power3.out" }, 3.35);
      d2StepsTl.fromTo("#d2-frame .d2-eb", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 3.7);
      d2StepsTl.fromTo("#d2-frame .d2-el", { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power3.out" }, 4.05);
      d2StepsTl.to("#d2-frame", { left: 565, top: 89, width: 490, height: 122, duration: 0.7, ease: "power3.inOut" }, 4.8);
      d2StepsTl.fromTo("#d2-frame .d2-h", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.07 }, 5.3);

      // the three bounds step in, in reading order
      d2in("#d2-r1", 6.8);
      d2in("#d2-r2", 10.6);
      d2in("#d2-r3", 14.4);

      // out-of-scope request drifts to the bounds, is refused, is ejected
      d2StepsTl.fromTo("#d2-stray", { x: 700, opacity: 0 }, { x: 0, opacity: 1, duration: 2.0, ease: "power3.out" }, 19.0);
      d2StepsTl.to("#d2-stray", { color: "#ff6b5c", borderColor: "#ff6b5c", duration: 0.15, ease: "power1.in" }, 22.2);
      d2StepsTl.to("#d2-stray", { x: "+=20", duration: 0.18, ease: "power2.out" }, 22.2);
      d2StepsTl.fromTo("#d2-ref", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 22.2);
      d2StepsTl.to("#d2-stray", { x: 760, opacity: 0, duration: 1.3, ease: "power3.in" }, 23.2);
      d2StepsTl.to("#d2-ref", { opacity: 0, duration: 0.4, ease: "power1.out" }, 23.2);
    }
    // the fragment may be inlined before or after the master's gsap script —
    // build on DOMContentLoaded when gsap isn't parsed yet.
    if (window.gsap) d2StepsBuild();
    else window.addEventListener("DOMContentLoaded", d2StepsBuild);
  </script>
</div>
